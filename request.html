<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Заявка на обмен — VNCash Vietnam</title><meta name="description" content="Оставьте заявку на обмен валют во Вьетнаме. Оператор подтвердит курс и условия лично."><meta name="theme-color" content="#0b1020"><link rel="icon" href="/favicon.svg">
<style>
*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#eef2ff;font:16px/1.5 system-ui,sans-serif}main{max-width:640px;margin:40px auto;padding:24px}a{color:#73ded0}.brand{font-weight:800;font-size:24px;text-decoration:none}h1{font-size:clamp(30px,6vw,42px);line-height:1.15;margin-bottom:12px}.intro,.hint{color:#aab7d4}form{margin-top:28px;padding:24px;background:#131c32;border:1px solid #2d3c5c;border-radius:20px}label{display:block;margin:18px 0 6px;font-weight:600}input,select,button{font:inherit;width:100%;border-radius:10px;padding:13px;border:1px solid #3c4d6c;background:#0b1429;color:inherit}input:focus,select:focus{outline:2px solid #73ded0}button{background:#73ded0;color:#072725;border:0;font-weight:750;cursor:pointer;margin-top:20px}button:disabled{opacity:.6;cursor:wait}.consent{display:flex;gap:12px;align-items:flex-start;font-size:14px;font-weight:400}.consent input{width:20px;margin-top:4px;flex-shrink:0}.trap{position:absolute;left:-10000px}#status{white-space:pre-line}.error{color:#ffb7b7}.success{color:#73ded0}.hint{font-size:14px}footer{margin-top:24px;font-size:14px}@media(max-width:500px){main{margin:12px auto;padding:18px}form{padding:18px}}
</style></head><body><main><a class="brand" href="/">VNCash <span style="color:#73ded0">Vietnam</span></a>
<h1>Заявка на обмен</h1><p class="intro">Укажите сумму и удобный способ получения. Оператор свяжется с вами и подтвердит курс, наличие и условия.</p>
<form id="request">
<label for="city">Город</label><input id="city" name="city" list="cities" maxlength="80" required placeholder="Например, Дананг"><datalist id="cities"><option>Дананг</option><option>Нячанг</option><option>Фукуок</option><option>Хошимин</option><option>Ханой</option></datalist>
<label for="direction">Отдаёте → получаете</label><select id="direction" name="direction" required><option value="">Выберите направление</option><option>RUB → VND</option><option>USD → VND</option><option>USDT → VND</option><option>CNY → VND</option><option>VND → RUB</option><option>VND → USD</option><option>USDT → USD</option></select>
<label for="amount">Сумма, которую отдаёте</label><input id="amount" name="amount" inputmode="decimal" maxlength="30" required placeholder="Например, 20000">
<label for="method">Как получить</label><select id="method" name="method" required><option>Наличные / доставка</option><option>Банкомат</option><option>На счёт во Вьетнаме</option><option>Alipay</option><option>Обсудить с оператором</option></select>
<label for="when">Когда нужен обмен</label><input id="when" name="when" maxlength="120" required placeholder="Сегодня, завтра или дата и время">
<label for="contact">Telegram или WhatsApp</label><input id="contact" name="contact" maxlength="120" required placeholder="@username или номер с кодом страны"><p class="hint">Достаточно контакта. Не указывайте реквизиты карт, пароли и данные документов.</p>
<div class="trap" aria-hidden="true"><label>Сайт<input name="website" tabindex="-1" autocomplete="off"></label></div>
<label class="consent"><input name="consent" type="checkbox" required><span>Разрешаю передать указанные данные оператору VNCash для ответа на эту заявку.</span></label>
<button type="submit">Отправить заявку</button><p id="status" role="status" aria-live="polite"></p>
</form><footer>Можно написать напрямую: <a href="https://t.me/krisanqi">Telegram</a> · <a href="https://wa.me/84935925904">WhatsApp</a><br>Актуальные курсы: <a href="https://t.me/vncash_danang">VNCash в Telegram</a></footer></main>
<script>
const form=document.getElementById('request'),status=document.getElementById('status'),button=form.querySelector('button');
let nonce=crypto.randomUUID(),submitted=false;
form.addEventListener('submit',async event=>{
 event.preventDefault();if(submitted)return;button.disabled=true;status.className='';status.textContent='Отправляем заявку…';
 const data=Object.fromEntries(new FormData(form));data.consent=form.elements.consent.checked;data.nonce=nonce;
 data.source=new URLSearchParams(location.search).get('source')==='facebook'?'facebook':'web';
 try{
  const response=await fetch('https://vietnamnews.duckdns.org/n8n/webhook/moneyup-request',{method:'POST',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify(data)});
  if(!response.ok)throw Error();const result=await response.json();
  if(!result.ok){status.className='error';status.textContent=result.error||'Проверьте поля формы.';button.disabled=false;return;}
  submitted=true;status.className='success';status.textContent='Заявка №'+result.number+' принята. Оператор ответит по указанному контакту и подтвердит курс и условия.';button.textContent='Заявка отправлена';
 }catch(error){status.className='error';status.textContent='Не удалось получить подтверждение. Повторите отправку: повторная попытка не создаст вторую заявку. Или напишите оператору в Telegram.';button.disabled=false;}
});
</script></body></html>
